name: Weekly Report

on:
  schedule:
    - cron: '0 9 * * 1'  # 每周一早9点运行
  workflow_dispatch:      # 也可手动触发

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Creator Automation
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          WEEK_END="$(date -u +%F)"
          WEEK_START="$(date -u -d "$WEEK_END - 6 days" +%F)"

          curl --fail-with-body -X POST "$WORKER_URL/weekly-report" \
            -H "Authorization: Bearer $WORKER_SECRET" \
            -H "Content-Type: application/json" \
            --data "{
              \"creatorName\": \"Leanna\",
              \"weekStart\": \"$WEEK_START\",
              \"weekEnd\": \"$WEEK_END\",
              \"metricsSummary\": \"GitHub Actions scheduled weekly report trigger. No social platform metrics were provided in this run.\",
              \"notes\": \"If metrics are missing, generate a conservative weekly planning report and clearly state data limitations.\",
              \"includeSearch\": true,
              \"searchQueries\": [
                \"AI creator economy trending topics this week\",
                \"x.com trending AI tools and agents this week\",
                \"content creator automation AI trends this week\"
              ],
              \"saveReport\": true
            }"
