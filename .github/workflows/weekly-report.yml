name: Weekly Report

on:
  schedule:
    - cron: '0 9 * * 1'  # 每周一早9点运行
  workflow_dispatch:      # 也可手动触发

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Creator Automation
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          curl -X POST $WORKER_URL/weekly-report \
            -H "Authorization: Bearer $WORKER_SECRET"
